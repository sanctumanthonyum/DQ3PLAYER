name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Baixar core Snes9x (libretro)
        run: |
          for ABI in arm64-v8a armeabi-v7a; do
            mkdir -p app/src/main/jniLibs/$ABI tmp_$ABI
            curl -fL https://buildbot.libretro.com/nightly/android/latest/$ABI/snes9x_libretro_android.so.zip -o tmp_$ABI/core.zip
            unzip -o tmp_$ABI/core.zip -d tmp_$ABI
            mv tmp_$ABI/snes9x_libretro_android.so app/src/main/jniLibs/$ABI/libsnes9x_libretro_android.so
          done
      - name: Compilar
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dq3player-apk
          path: app/build/outputs/apk/debug/*.apk
